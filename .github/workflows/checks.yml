name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  # Permission for checking out code
  contents: read

jobs:
  build:
    name: Check & Build Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: chmod +x ./scripts/gofmtcheck.sh
      - name: gofmt Check
        run: ./scripts/gofmtcheck.sh
      - run: go mod tidy
      - run: go mod vendor
      - name: Check vendor for changes
        run: git diff --exit-code
      - name: Build
        run: go build -v

  diff:
    name: Check Generated Code Difference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - uses: hashicorp/setup-terraform@v4
      - name: Generate provider code
        run: go generate
      - name: Check generated code for diffs
        run: git diff --exit-code

  go-releaser:
    name: Dry-Run GoReleaser Check
    needs: [build, diff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unshallow
        run: git fetch --prune --unshallow
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: latest
      - name: GoReleaser Release Check
        run: goreleaser release --skip=publish,sign --snapshot --clean

  unit-tests:
    name: Unit Tests
    needs: [build, diff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      # Acceptance tests are skipped as TF_ACC is not set
      - name: Unit Tests
        run: go test github.com/CiscoDevNet/terraform-provider-aci/v2/internal/provider -v -mod=vendor
