properties:
  tnL3extOutName:
    reference:
      classes:
      - l3extOut
    test_config:
      create:
      - assert_value: aci_l3_outside.test.name
        config_value: aci_l3_outside.test.name
        value_type: reference
      update:
      - assert_value: aci_l3_outside.test_2.name
        config_value: aci_l3_outside.test_2.name
        value_type: reference
resource_name: relation_from_bridge_domain_to_route_control_profile
test_config:
  dependencies:
  - class_name: rtctrlProfile
    dependencies:
    - class_name: l3extOut
      config_overrides:
        name: name_1
        relation_l3ext_rs_ectx: aci_vrf.test.id
        tenant_dn: aci_tenant.test.id
      dependencies:
      - class_name: fvTenant
      - class_name: fvCtx
        config_overrides:
          parent_dn: aci_tenant.test.id
        dependencies:
        - class_name: fvTenant
      reference: aci_l3_outside.test.id
    role: target
  - class_name: rtctrlProfile
    dependencies:
    - class_name: l3extOut
      config_overrides:
        name: name_2
        relation_l3ext_rs_ectx: aci_vrf.test.id
        tenant_dn: aci_tenant.test.id
      dependencies:
      - class_name: fvTenant
      - class_name: fvCtx
      reference: aci_l3_outside.test_2.id
    reference: aci_route_control_profile.test_2.id
    role: target
