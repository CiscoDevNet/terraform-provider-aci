    role: parent
    target_classes:
    - fvAEPg
  - class_name: fvESg
    dependencies:
    - class_name: fvAp
    role: parent
    target_classes:
    - fvESg
  - class_name: l3extInstP
    dependencies:
    - class_name: l3extOut
    role: parent
    target_classes:
    - l3extInstP
  - class_name: fvESg
    config_overrides:
      name: esg_0
    dependencies:
    - class_name: fvAp
    reference: aci_endpoint_security_group.test_endpoint_security_group_0.id
    role: target
  - class_name: fvESg
    config_overrides:
      name: esg_1
    dependencies:
    - class_name: fvAp
