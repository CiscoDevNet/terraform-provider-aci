    reference: aci_application_epg.test_application_epg_0.id
    role: target
  - class_name: fvAEPg
    config_overrides:
      name: epg_1
    dependencies:
    - class_name: fvAp
    reference: aci_application_epg.test_application_epg_1.id
    role: target
  - class_name: l3extInstP
    config_overrides:
      name: ext_epg_0
