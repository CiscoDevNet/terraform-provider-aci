documentation:
  resource:
    notes:
    - The `aci_epg_useg_sub_block_statement` is used to create nested sub-block statements
      by referencing itself.
  sub_category: Application Management
  ui_locations:
  - Tenants -> Application Profiles -> uSeg EPGs -> uSeg Attributes
properties:
  match:
    default_values:
      any: ""
    documentation:
      description: The Matching Rule Type of the %s object.
    test_config:
      create:
      - config_value: all
  name:
    test_config:
      create:
      - config_value: sub_criterion
      datasource_missing:
      - config_value: sub_criterion_non_existing
resource_name: epg_useg_sub_block_statement
test_config:
  dependencies:
  - class_name: fvSCrtrn
    config_overrides:
      name: parent_name_1
      parent_dn: '{{aci_epg_useg_block_statement.test.id}}'
    dependencies:
    - class_name: fvCrtrn
    role: parent
