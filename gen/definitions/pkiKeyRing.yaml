  keyType:
    default_values:
      RSA: ""
    documentation:
      description: The type used by the provided key.
    test_config:
      create:
      - config_value: RSA
  modulus:
    test_config:
      create:
      - config_value: mod2048
  parentDn:
    default_values:
      uni/userext/pkiext: ""
  regen:
    attribute_name: regenerate
    default_values:
      "no": ""
    test_config:
      create:
      - config_value: "no"
  tp:
    attribute_name: certificate_authority
    documentation:
      description: The certificate of the Certificate Authority (CA) that issued the
        certificate provided in the 'certificate' attribute. The CA can be a root
        CA, an intermediate CA, or a trust anchor in a chain of trust leading to a
        root CA.
    reference:
      classes:
      - pkiTP
      example_attribute: name
      example_class: pkiTP
    test_config:
      create:
      - config_value: aci_certificate_authority.test_certificate_authority_0.name
        value_type: reference
