documentation:
  sub_category: L4-L7
  ui_locations:
  - Tenants -> Services -> L4-L7 -> Imported Devices
properties:
  description:
    documentation:
      description: The description of the Imported Logical Device object.
  ldev:
    attribute_name: logical_device
    documentation:
      description: The distinguished name (DN) of the Logical Device to import (ACI
        object [vnsLDevVip](https://pubhub.devnetcloud.com/media/model-doc-latest/docs/app/index.html#/objects/vnsLDevVip/overview).
        The Logical Device can be configured using [aci_l4_l7_device](https://registry.terraform.io/providers/CiscoDevNet/aci/latest/docs/resources/l4_l7_devices)
        resource). The referenced Logical Device must belong to a different tenant
        from the Imported Logical Device.
    reference:
      classes:
      - vnsLDevVip
      example_class: vnsLDevVip
    test_config:
      create:
      - config_value: aci_l4_l7_device.test_imported_device.id
        value_type: reference
      datasource_missing:
      - config_value: uni/tn-test_tenant_imported_device/lDevVip-test_imported_device
resource_name: imported_logical_device
test_config:
  dependencies:
  - class_name: vnsLDevVip
    config_overrides:
      active: "no"
      context_aware: single-Context
      device_type: PHYSICAL
      function_type: GoTo
      is_copy: "no"
      mode: legacy-Mode
      name: name_1
      promiscuous_mode: "no"
      relation_vns_rs_al_dev_to_phys_dom_p: uni/phys-name_1
      service_type: OTHERS
      tenant_dn: aci_tenant.test_tenant_imported_device.id
    dependencies:
    - class_name: fvTenant
      reference: aci_tenant.test_tenant_imported_device.id
    - class_name: physDomP
      config_overrides:
        name: name_1
      order_only: true
      reference: aci_physical_domain.test.id
    reference: aci_l4_l7_device.test_imported_device.id
    role: target
