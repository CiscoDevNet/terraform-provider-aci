documentation:
  dn_formats:
  - uni/tn-{name}/out-{name}/conslbl-{name}/rslblToProfile-[{tDn}]-{direction}
  resource:
    notes:
    - This resource should not be used in combination with the `l3out_consumer_label`
      nested attributes of other resources for the same object. Doing so will result
      in unexpected behaviour.
  sub_category: L3Out
  ui_locations:
  - Tenants -> Networking -> L3Outs -> Policy -> Main -> Consumer Label
properties:
  direction:
    documentation:
      description: The direction on which to apply the Route Map associated with the
        Route Control Profile.
    test_config:
      create:
      - config_value: export
      datasource_missing:
      - config_value: import
      default:
      - config_value: import
  tDn:
    documentation:
      description: The distinguished name (DN) of the Route Control Profile object.
resource_name: relation_from_l3out_consumer_label_to_route_control_profile
test_config:
  dependencies:
  - class_name: l3extConsLbl
    dependencies:
    - class_name: l3extOut
      config_overrides:
        name: name_1
        relation_l3ext_rs_ectx: aci_vrf.test.id
        tenant_dn: aci_tenant.test.id
      dependencies:
      - class_name: fvTenant
      - class_name: fvCtx
        config_overrides:
          parent_dn: aci_tenant.test.id
        dependencies:
        - class_name: fvTenant
      reference: aci_l3_outside.test.id
    role: parent
    target_classes:
    - rtctrlProfile
  - class_name: rtctrlProfile
    dependencies:
    - class_name: fvTenant
    role: target
  - class_name: rtctrlProfile
    dependencies:
    - class_name: fvTenant
    reference: aci_route_control_profile.test_2.id
    role: target
