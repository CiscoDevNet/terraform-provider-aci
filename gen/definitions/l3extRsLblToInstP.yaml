documentation:
  dn_formats:
  - uni/tn-{name}/out-{name}/conslbl-{name}/rslblToInstP-[{tDn}]
  resource:
    notes:
    - This resource should not be used in combination with the `l3out_consumer_label`
      nested attributes of other resources for the same object. Doing so will result
      in unexpected behaviour.
  sub_category: L3Out
  ui_locations:
  - Tenants -> Networking -> L3Outs -> Policy -> Main -> Consumer Label
properties:
  tDn:
    documentation:
      description: The distinguished name (DN) of the External EPG object.
    example_config:
      minimum:
      - reference:
          class_name: l3extInstP
          resource_name: external_network_instance_profile
    test_config:
      datasource_missing:
      - config_value: uni/tn-name_1/out-name_1/instP-name_1_not_existing
resource_name: relation_from_l3out_consumer_label_to_external_epg
test_config:
  dependencies:
  - class_name: l3extConsLbl
    dependencies:
    - class_name: l3extOut
      config_overrides:
        name: name_1
        relation_l3ext_rs_ectx: aci_vrf.test.id
        tenant_dn: aci_tenant.test.id
      dependencies:
      - class_name: fvTenant
      - class_name: fvCtx
        config_overrides:
          parent_dn: aci_tenant.test.id
        dependencies:
        - class_name: fvTenant
      reference: aci_l3_outside.test.id
    role: parent
    target_classes:
    - l3extInstP
  - class_name: l3extInstP
    dependencies:
    - class_name: l3extOut
      reference: aci_l3_outside.test.id
    role: target
  - class_name: l3extInstP
    dependencies:
    - class_name: l3extOut
      reference: aci_l3_outside.test.id
    reference: aci_external_epg.test_2.id
    role: target
