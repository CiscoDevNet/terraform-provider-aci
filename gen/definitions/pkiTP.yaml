# Test limitation: certUsage is excluded from acceptance tests.
# This is a legacy exclusion whose original reason was not recorded.
# Metadata marks it configurable but readWrite is false; create/update behavior needs validation.
# TODO: Reassess create/update behavior and response values after the generator refactor.

documentation:
  sub_category: AAA
  ui_locations:
  - Admin -> AAA -> Security -> Certificate Authorities
  - Cloud Network Controller -> Administrative -> Security -> Certificate Authorities
example_files:
- certificate.pem
parent_dn_variants:
- parent_class: fvTenant
  rn_prepend: certstore
  test_platform: cloud
  wrapper_class: cloudCertStore
