  certUsage:
    attribute_name: certificate_usage
    documentation:
      description: The usage of the Certificate Authority object which can be Web
        Service/Authentication (WebSvcOrAuth), Platform Experience Grid (pxGrid),
        or both.
    example_config:
      full:
      - value: WebSvcOrAuth
    test_config:
      create:
      - config_value: WebSvcOrAuth
      - config_value: pxGrid
      default:
      - config_value: WebSvcOrAuth
      ignore_in_test: true
    value_type: set
  parentDn:
